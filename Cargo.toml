[package]
name = "ciris-status"
version = "0.3.57"
edition = "2021"
description = "The ciris.ai public health/status surface — now a ciris-server fabric node + a StatusAdapter (mirrors CIRISAgent's adapter model). Serves /health, /v1/status, /api/v1/status, /api/v1/status/history + the public scoring roster (Flow A, own corpus) + live SSE/WS, by live outbound probes + a SQLite uptime history. The federation node (engine, edge, consent:replication, read API, ownership, safety, NAT-traversal) is ciris-server's serve; the status page is the adapter."
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "ciris-status"
path = "src/main.rs"

[dependencies]
# ── The fabric node ──────────────────────────────────────────────────────────
# ciris-status IS a ciris-server node now (no optional `fabric` feature): the
# whole node — engine + edge + consent:replication + read API + NodeCode +
# ownership + safety + NAT-traversal — is ciris-server's `serve_with_adapter`,
# and the status page is a `StatusAdapter: ciris_server::Adapter` folded onto the
# SAME shared core. Default features (NOT python, NOT pkcs11).
# Pinned to ciris-server v0.5.189 — THE MESH RELIABILITY CUT, and the one this
# crate has a direct operational stake in twice over.
#
# 1. THE DUPLICATE STORM IS FIXED (CIRISPersist#771). This node's own canonical
#    peer refused 7,536 attestation envelopes in a six-hour window — 428 distinct
#    rows re-sent up to 82 times each — because `put_attestation` reported an
#    already-held row as `federation_backend`, a backend ERROR, so the sender
#    never learned it had landed and retried forever. 58% of all refusals on that
#    node, and pure churn on the transport ciris-status watches. persist v38.6.0
#    returns `AlreadyHeld`; edge routes it to `ApplyOutcome::Duplicate` — counted,
#    not swallowed.
#
# 2. THE ACTOR/NODE KEY SPLIT (CC 3.4.7.3, CIRISConstitution#95). A node's
#    substrate identity was whatever key the host handed it, and in the embedded
#    fold that is an `identity_type = agent` key. So the Reticulum transport
#    identity, `self_key_id` and the de-admission self all named a key carrying
#    AGENCY — and persist's agency gate constrains only a NODE-ONLY recipient, so
#    the fusion did not blur "infrastructure must not have agency", it switched
#    the rule off.
#
#    A node now mints its own `<alias>-node` key, registers it `identity_type =
#    node`, takes the owner-binding, and authors its replication consent with its
#    own signer. Provisioning is a READINESS GATE: edge must not start on a half
#    identity. ciris-status is a fabric node, so this is its identity too.
#
# The client is a PACKAGE, not a tree (CIRISServer#471): `client/` is deleted —
# 1,813 files, 764k lines — and `ciris-client==0.5.189` comes from PyPI. Server
# and client versions now move together, gated: a node shipping an older client
# greets its own operator with "Update recommended" against the dependency it was
# built with.
#
# 0.5.190 rides along and changes nothing operationally for a fabric node: it is
# the ANDROID INSTALL FIX (CIRISServer#493). 0.5.189's unconditional
# `ciris-client==` pin met a client wheel matrix with no `py3-none-any`, so a pip
# targeting Android matched no tag and the `==` pin rejected the fallback —
# `pip install ciris-server` failed outright there. Fixed by splitting the
# ARTIFACT rather than the dependency: the client's platform wheels carry the
# desktop uber-jar, `py3-none-any` carries none (3.14 MiB against the 63 MiB it
# used to be). ciris-status installs the manylinux wheel and never sees `any`, so
# this cut is inherited, not consumed — recorded because the pin moved and a
# record that skips a version is a record that has started drifting.
#
# Substrate underneath: edge v18.10.0 (CIRISEdge#541 — `use_node_identity`, and
# the advertised id split from the transport-identity STORAGE key, which is what
# stops a keystore-backed node silently regenerating its destination hash and
# invalidating every saved peer route) + persist v38.6.0 (#771 AlreadyHeld, #773
# CC 3.4.7.3 graduation: membership-test agency gate + `may_act_through`) +
# verify v13.6.1.
#
# Prior: v0.5.188 = THE NODE SAYS WHEN IT IS IN TROUBLE — health derived from a
# warning registry (memory via the process's own cgroup, CPU/disk STALL from PSI
# rather than utilisation, replication convergence over a window, retention),
# every probe reporting WHY it cannot answer instead of a comfortable zero.
ciris-server = { git = "https://github.com/CIRISAI/CIRISServer", tag = "v0.5.191" }

# NO ciris-persist PIN. persist arrives through ciris-server's `pub use
# ciris_persist` re-export, so this crate cannot resolve a different persist
# than the server it embeds. A second git pin here would be a second source of
# truth for one substrate: cargo resolves both, and `Engine` from one is then a
# different TYPE from `Engine` in the other — the CIRISPersist#109 cross-instance
# shape, arriving by the source-tree door. Reach persist as
# `ciris_server::ciris_persist::…` (each module aliases it with one `use`).

# Impl `ciris_server::Adapter` (async fn in trait). async-trait 0.1 + axum 0.8
# match ciris-server.
async-trait = "0.1"

# emit_liveness signs + assembles the federation `Attestation` row: base64 for
# the signature wire form, sha2 for the original_content_hash anchor, hex for the
# digest encoding. All already in the lock as substrate-transitive deps.
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# rustls (not openssl) so the binary is self-contained and cross-builds cleanly.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Pinned to 0.31 (libsqlite3-sys 0.28) to match ciris-persist v9.10.0 (both declare `links = "sqlite3"`,
# so cargo requires a single libsqlite3-sys across the graph).
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
strip = "symbols"

