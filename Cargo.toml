[package]
name = "ciris-status"
version = "0.3.36"
edition = "2021"
description = "The ciris.ai public health/status surface — now a ciris-server fabric node + a StatusAdapter (mirrors CIRISAgent's adapter model). Serves /health, /v1/status, /api/v1/status, /api/v1/status/history + the public scoring roster (Flow A, own corpus) + live SSE/WS, by live outbound probes + a SQLite uptime history. The federation node (engine, edge, consent:replication, read API, ownership, safety, NAT-traversal) is ciris-server's serve; the status page is the adapter."
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "ciris-status"
path = "src/main.rs"

[dependencies]
# ── The fabric node ──────────────────────────────────────────────────────────
# ciris-status IS a ciris-server node now (no optional `fabric` feature): the
# whole node — engine + edge + consent:replication + read API + NodeCode +
# ownership + safety + NAT-traversal — is ciris-server's `serve_with_adapter`,
# and the status page is a `StatusAdapter: ciris_server::Adapter` folded onto the
# SAME shared core. Default features (NOT python, NOT pkcs11).
# Pinned to ciris-server v0.5.117 — the mobile-delivery cut: #264 fold reentrancy shield + edge v13.1.0 (#353 reply-over-inbound-link) + rust logs everywhere. Prior: v0.5.115 = TRACE-DELIVERY UNBLOCKED (mesh-works cut +
# the #260 KEX fix: persist v17.3.0 ResolveEncryptionKeys via the proxy, edge
# v13.0.9; harness-verified KEX PRESENT in 45s) + the 7 agent federation routes
# (#261). Prior: v0.5.114 = THE MESH-WORKS CUT: coherent triple verify
# v10.2.0 / persist v17.2.0 / edge v13.0.8, end-to-end PROVEN by CIRISServer's
# harness/mesh-repro QA runner (#258 SUCCESS: both nodes root, anti-entropy
# rounds complete all 3 kinds). Closes the responder seams (CIRISEdge#348) atop
# the full 0.5.108-113 routing/identify/re-key saga — Node B moves with the
# fleet (wire-coherent with Node A + agents on >=0.5.114). Also ships the full
# edge event-bus logger, so Node B's logs now narrate announce/link/path
# lifecycle. Zero-env boot unchanged (config-as-CEG via graph_config).
ciris-server = { git = "https://github.com/CIRISAI/CIRISServer", tag = "v0.5.163" }

# ciris-persist (sqlite) at the SAME pin ciris-server uses (v11.9.1) so the
# lockfile resolves a SINGLE ciris-persist (ciris-server v0.5.72 pins v11.9.1 too).
# The adapter touches persist types directly: `Engine::sqlite_backend()`
# (the SqliteBackend handle that impls both ReadEngine + FederationDirectory),
# `CallerScope::Unauthenticated` (the Flow-A public read scope), and the
# federation `Attestation` row emit_liveness assembles.
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v30.6.0", features = ["sqlite"] }

# Impl `ciris_server::Adapter` (async fn in trait). async-trait 0.1 + axum 0.8
# match ciris-server.
async-trait = "0.1"

# emit_liveness signs + assembles the federation `Attestation` row: base64 for
# the signature wire form, sha2 for the original_content_hash anchor, hex for the
# digest encoding. All already in the lock as substrate-transitive deps.
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# rustls (not openssl) so the binary is self-contained and cross-builds cleanly.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Pinned to 0.31 (libsqlite3-sys 0.28) to match ciris-persist v9.10.0 (both declare `links = "sqlite3"`,
# so cargo requires a single libsqlite3-sys across the graph).
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
strip = "symbols"
